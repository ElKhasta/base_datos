<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes · RentaVisual</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/estilos.css" rel="stylesheet" />
</head>
<body data-pagina="clientes">

  <div id="app-navbar"></div>

  <main class="container py-4">

    <div class="encabezado-pagina">
      <div>
        <h1>Clientes</h1>
        <p class="subtitulo">Alta, edición y baja lógica. El historial de rentas se conserva.</p>
      </div>
      <button class="btn btn-primary no-print" id="btnNuevoCliente">
        <i class="bi bi-person-plus me-1"></i>Nuevo cliente
      </button>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">

        <!-- Barra de filtros -->
        <div class="row g-2 align-items-center mb-3">
          <div class="col-12 col-md-6">
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
              <input type="search" class="form-control" id="buscar"
                     placeholder="Buscar por nombre, teléfono o correo…" autocomplete="off" />
            </div>
          </div>
          <div class="col-7 col-md-3">
            <select class="form-select" id="filtroActivos">
              <option value="">Todos</option>
              <option value="true">Solo activos</option>
              <option value="false">Solo inactivos</option>
            </select>
          </div>
          <div class="col-5 col-md-3 text-md-end">
            <span class="badge badge-suave" id="contadorClientes">—</span>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle tabla-datos">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Alta</th>
                <th>Estatus</th>
                <th class="text-end no-print">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaClientes">
              <tr><td colspan="6" class="text-center py-4 text-muted">Cargando…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <div id="app-footer"></div>

  <!-- ===================== Modal crear / editar ===================== -->
  <div class="modal fade" id="modalCliente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="formCliente" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="tituloModalCliente">Nuevo cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="clienteId" />

          <div class="mb-3">
            <label class="form-label requerido" for="nombre">Nombre completo</label>
            <input type="text" class="form-control" id="nombre" required
                   minlength="3" maxlength="100" placeholder="Ej. Luis Ramírez" />
            <div class="invalid-feedback">Escribe al menos 3 caracteres.</div>
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="telefono">Teléfono</label>
              <input type="tel" class="form-control" id="telefono" maxlength="20"
                     placeholder="5512345678" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="email">Correo</label>
              <input type="email" class="form-control" id="email"
                     placeholder="cliente@correo.com" />
              <div class="invalid-feedback">Escribe un correo válido.</div>
            </div>
          </div>

          <div class="form-check form-switch mt-3">
            <input class="form-check-input" type="checkbox" id="activo" checked />
            <label class="form-check-label" for="activo">Cliente activo (puede rentar)</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnGuardarCliente">
            <i class="bi bi-check-lg me-1"></i>Guardar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== Modal historial ===================== -->
  <div class="modal fade" id="modalHistorial" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloHistorial">Historial del cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle tabla-datos">
              <thead>
                <tr>
                  <th>Folio</th>
                  <th>Inicio</th>
                  <th>Equipo</th>
                  <th class="text-center">Cantidad</th>
                  <th class="text-end">Subtotal</th>
                  <th>Estado</th>
                  <th>Devolución</th>
                </tr>
              </thead>
              <tbody id="tablaHistorial">
                <tr><td colspan="7" class="text-center py-4 text-muted">Cargando…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/comun.js"></script>
  <script src="assets/js/paginas/clientes.js"></script>
</body>
</html>
