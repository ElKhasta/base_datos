<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actividad · RentaVisual</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/estilos.css" rel="stylesheet" />
</head>
<body data-pagina="actividad" data-solo-admin="true">

  <div id="app-navbar"></div>

  <main class="container py-4">

    <div class="encabezado-pagina">
      <div>
        <h1>Actividad</h1>
        <p class="subtitulo">
          Bitácora de auditoría: quién hizo qué y cuándo. Solo administradores.
        </p>
      </div>
      <button class="btn btn-outline-secondary no-print" id="btnRecargarActividad">
        <i class="bi bi-arrow-clockwise me-1"></i>Recargar
      </button>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">

        <div class="row g-2 align-items-center mb-3">
          <div class="col-12 col-md-4">
            <select class="form-select" id="filtroAccion">
              <option value="">Todas las acciones</option>
            </select>
          </div>
          <div class="col-7 col-md-3">
            <select class="form-select" id="filtroEntidad">
              <option value="">Todas las entidades</option>
              <option value="renta">Rentas</option>
              <option value="cliente">Clientes</option>
              <option value="usuario">Usuarios</option>
              <option value="equipo">Equipos</option>
              <option value="categoria">Categorías</option>
              <option value="pago">Pagos</option>
            </select>
          </div>
          <div class="col-5 col-md-5 text-md-end">
            <span class="badge badge-suave" id="contadorActividad">—</span>
          </div>
        </div>

        <div id="feedActividad" class="feed">
          <div class="text-center text-muted py-5">
            <span class="spinner-border spinner-border-sm me-2"></span>Cargando actividad…
          </div>
        </div>

        <div class="text-center mt-3">
          <button class="btn btn-outline-primary d-none" id="btnCargarMas">
            <i class="bi bi-arrow-down-circle me-1"></i>Cargar más
          </button>
        </div>
      </div>
    </div>

    <p class="text-muted small mt-3 mb-0">
      <i class="bi bi-shield-lock me-1"></i>
      La bitácora es append-only desde la aplicación: no se edita ni se borra
      desde la interfaz. Cada aprobación, rechazo, pago y cambio de cliente queda registrado.
    </p>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/comun.js"></script>
  <script src="assets/js/paginas/actividad.js"></script>
</body>
</html>
